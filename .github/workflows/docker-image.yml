name: Build e push Docker

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]           # es. v1.2.0 → pubblica anche il tag 1.2.0
  workflow_dispatch:          # avvio manuale dalla scheda Actions
  # NON usare pull_request_target: passerebbe i secret alle PR dai fork

permissions:
  contents: read              # permessi minimi per il GITHUB_TOKEN

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: dockerhub    # usa secret e regole dell'environment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Metadata (tag e label)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/nexus
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: QEMU (per build multi-architettura)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          # file: ./percorso/Dockerfile   # se il Dockerfile non è nella root
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
